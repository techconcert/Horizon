    <meta charset="UTF-8" />

    <title>Horizon</title>
    <meta name="description" content="A recovery app offering daily reflections, interactive sober counters, sentiment charts, breathing pacers, and 12-Step lessons." />
    <meta property="og:title" content="Horizon" />
    <meta property="og:description" content="A recovery app offering daily reflections, interactive sober counters, sentiment charts, breathing pacers, and 12-Step lessons." />
    <!-- Instant PWA Version Check & Cache Purge: on version bump, force clears all service-worker & browser caches -->
    <script>
      (function() {
        var APP_VERSION = '2.1.36';
        var storedVersion = localStorage.getItem('horizon_app_version');
        if (!storedVersion || storedVersion !== APP_VERSION) {
          console.log('[Horizon] Version update detected (' + storedVersion + ' -> ' + APP_VERSION + '). Purging stale caches...');
          if ('caches' in window) {
            caches.keys().then(function(names) {
              return Promise.all(names.map(function(n) { return caches.delete(n); }));
            }).catch(function() {});
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }).catch(function() {});
          }
          localStorage.setItem('horizon_app_version', APP_VERSION);
          if (storedVersion && storedVersion !== APP_VERSION) {
            window.location.reload();
          }
        }
      })();
    </script>
    <!-- Instant PWA Self-Healing: clears stale service-worker caches if missing chunks cause a blank screen -->
    <script>
      (function() {
        var key = 'horizon_recovery_lock';
        function autoHeal() {
          var now = Date.now();
          var last = parseInt(sessionStorage.getItem(key) || '0', 10);
          if (now - last < 8000) return; // Debounce reloads
          sessionStorage.setItem(key, String(now));
          console.warn('[Horizon] Auto-healing stale PWA cache and service worker...');
          if ('caches' in window) {
            caches.keys().then(function(names) {
              return Promise.all(names.map(function(n) { return caches.delete(n); }));
            }).catch(function() {});
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }).catch(function() {});
          }
          setTimeout(function() {
            window.location.reload();
          }, 300);
        }

        window.addEventListener('error', function(e) {
          var target = e.target;
          var isAsset = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
          var msg = (e.message || '').toLowerCase();
          var isModuleOrSyntax = msg.indexOf('unexpected token') !== -1 ||
                                 msg.indexOf('dynamically imported module') !== -1 ||
                                 msg.indexOf('loading chunk') !== -1 ||
                                 msg.indexOf('importing a module script failed') !== -1;
          if (isAsset || isModuleOrSyntax) {
            autoHeal();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e.reason && (e.reason.message || String(e.reason))) || '';
          if (reason.indexOf('dynamically imported module') !== -1 || reason.indexOf('Loading chunk') !== -1) {
            autoHeal();
          }
        });
      })();
    </script>
